<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clasificador de imágenes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f0f2f5; }
    .upload-card {
      border: 2px dashed #6c757d;
      border-radius: 12px;
      transition: border-color .2s, background .2s;
      cursor: pointer;
    }
    .upload-card:hover, .upload-card.drag-over {
      border-color: #0d6efd;
      background: #e8f0fe;
    }
    .badge-tipo { font-size: .85rem; letter-spacing: .03em; }
    #preview-box img { max-height: 200px; border-radius: 8px; }
    .spinner-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }
    .spinner-overlay.show { display: flex; }
    .resultado-item { border-left: 4px solid #0d6efd; padding-left: 12px; margin-bottom: 12px; }
  </style>
</head>
<body>

<div class="spinner-overlay" id="spinner">
  <div class="text-center text-white">
    <div class="spinner-border mb-3" style="width:3rem;height:3rem;" role="status"></div>
    <p class="fs-5">Clasificando imagen con Rekognition…</p>
  </div>
</div>

<div class="container py-5">

  <div class="text-center mb-5">
    <h1 class="fw-bold"><i class="bi bi-image-fill text-primary me-2"></i>Clasificador de imágenes</h1>
  </div>

  <div class="row g-4 justify-content-center">

    <!-- PANEL SUBIDA -->
    <div class="col-lg-5">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white fw-semibold">
          <i class="bi bi-cloud-upload me-1"></i> Subir imagen
        </div>
        <div class="card-body">
          <div class="upload-card p-4 text-center mb-3" id="dropZone"
               onclick="document.getElementById('archivoInput').click()">
            <i class="bi bi-image text-secondary" style="font-size:2.5rem;"></i>
            <p class="mt-2 mb-0 text-muted">Arrastra una imagen aquí<br>o haz clic para seleccionar</p>
          </div>
          <input type="file" id="archivoInput" accept="image/*" class="d-none">
          <div id="preview-box" class="text-center mb-3 d-none">
            <img id="previewImg" src="" alt="preview" class="img-fluid shadow-sm">
            <p id="previewNombre" class="mt-2 text-muted small"></p>
          </div>
          <button id="btnSubir" class="btn btn-primary w-100" disabled>
            <i class="bi bi-send me-1"></i> Clasificar y guardar
          </button>
        </div>
      </div>
    </div>

    <!-- RESULTADO -->
    <div class="col-lg-5">
      <div id="resultadoCard" class="card shadow-sm d-none h-100">
        <div class="card-header bg-success text-white fw-semibold">
          <i class="bi bi-check-circle me-1"></i> Resultado de clasificación
        </div>
        <div class="card-body">
          <div class="resultado-item">
            <span class="text-muted small">Tipo detectado</span>
            <div id="resTipo" class="mt-1"><span class="badge bg-primary badge-tipo">—</span></div>
          </div>
          <div class="resultado-item">
            <span class="text-muted small">Descripción</span>
            <div id="resDescripcion" class="fw-semibold mt-1">—</div>
          </div>
          <div class="resultado-item">
            <span class="text-muted small">Nombre del archivo</span>
            <div id="resNombre" class="fw-semibold mt-1 text-truncate">—</div>
          </div>
        </div>
      </div>

      <!-- Placeholder cuando no hay resultado -->
      <div id="placeholderCard" class="card shadow-sm h-100">
        <div class="card-body d-flex align-items-center justify-content-center text-muted" style="min-height:200px;">
          <div class="text-center">
            <i class="bi bi-arrow-left-circle" style="font-size:2rem;"></i>
            <p class="mt-2">El resultado aparecerá aquí</p>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const API_BASE = "/clasificar/";
  let archivoSeleccionado = null;

  const dropZone = document.getElementById('dropZone');
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) mostrarPreview(file);
  });

  document.getElementById('archivoInput').addEventListener('change', e => {
    const file = e.target.files[0];
    if (file) mostrarPreview(file);
  });

  function mostrarPreview(file) {
    archivoSeleccionado = file;
    const reader = new FileReader();
    reader.onload = ev => {
      document.getElementById('previewImg').src = ev.target.result;
      document.getElementById('previewNombre').textContent = file.name;
      document.getElementById('preview-box').classList.remove('d-none');
      document.getElementById('btnSubir').disabled = false;
    };
    reader.readAsDataURL(file);
  }

  document.getElementById('btnSubir').addEventListener('click', async () => {
    if (!archivoSeleccionado) return;
    document.getElementById('spinner').classList.add('show');
    document.getElementById('btnSubir').disabled = true;

    try {
      const base64 = await fileToBase64(archivoSeleccionado);
      const payload = {
        nombre:        archivoSeleccionado.name,
        imagen_base64: base64.split(',')[1],
        content_type:  archivoSeleccionado.type,
      };

      const resp = await fetch(API_BASE, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(payload),
      });

      if (!resp.ok) throw new Error(`Error ${resp.status}`);
      const resultado = await resp.json();
      mostrarResultado(resultado);

    } catch (err) {
      alert('Error al procesar la imagen: ' + err.message);
      console.error(err);
    } finally {
      document.getElementById('spinner').classList.remove('show');
      document.getElementById('btnSubir').disabled = false;
    }
  });

  function mostrarResultado(data) {
    const colores = {
      'Factura': 'warning text-dark', 'Foto': 'info text-dark',
      'Documento': 'secondary', 'Diagrama': 'success', 'Otro': 'dark', 'Pendiente': 'light text-dark'
    };
    const tipo = data.tipo_detectado || '?';
    document.getElementById('resTipo').innerHTML =
      `<span class="badge bg-${colores[tipo] || 'primary'} badge-tipo">${tipo}</span>`;
    document.getElementById('resDescripcion').textContent = data.descripcion || '—';
    document.getElementById('resNombre').textContent = data.nombre || '—';
    document.getElementById('placeholderCard').classList.add('d-none');
    document.getElementById('resultadoCard').classList.remove('d-none');
  }

  function fileToBase64(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload  = () => res(r.result);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
  }
</script>
</body>
</html>
